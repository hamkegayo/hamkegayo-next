# 브라우저 E2E — 핵심 흐름을 실제 화면으로 검증한다 (#214).
#
#   이용자 예약 → 파트너 수락 → 이용자 선택·선결제 → 예약 확정 → 관리자(2단계 인증) 확인
#
# 릴리즈(dev → main) PR 에서만 돈다. 빌드와 브라우저 실행으로 수 분이 걸려 모든 작업 PR 에
# 붙이지 않는다. 결제는 모의 PG(e2e/support/mock-nicepay.mjs)로 처리하고 실제 NICEPAY·메일은
# 호출하지 않는다 — docs/testing.md
name: E2E Check

on:
    pull_request:
        branches: ["main", "dev"] # TEMP: #214 PR 검증용, 확인 후 제거
    # 필요할 때 Actions 탭에서 수동 실행 (main 에 이 파일이 있어야 보인다)
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        name: 브라우저 E2E (Playwright)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - run: npm ci

            - uses: supabase/setup-cli@v1
              with:
                  # be-check.yml 과 같은 버전. 올리면 -x 서비스 이름이 바뀔 수 있다.
                  version: 2.117.0

            # E2E 는 Auth·REST·Storage 가 필요하다. 메일(mailpit)은 Resend 목이라 뺀다.
            - name: Supabase 로컬 스택 기동
              run: |
                  supabase start -x mailpit,studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

            - name: .env.local 생성 · 테스트 계정 시드
              run: |
                  eval "$(supabase status -o env)"
                  {
                    echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
                    echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
                    echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
                  } > .env.local
                  npm run seed:dev
                  npm run seed:admin

            - name: Playwright 브라우저 설치
              run: npx playwright install --with-deps chromium

            # playwright.config.ts 가 모의 PG 서버와 프로덕션 빌드(next build → start)를 띄운다.
            - name: E2E 실행
              run: npm run test:e2e

            - name: 실패 시 리포트·트레이스 업로드
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
